name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 6.3
        run: |
          curl -s https://raw.githubusercontent.com/swiftlang/swiftly/main/install.sh | bash
          ~/.swiftly/bin/swiftly install 6.3.3
          echo "$HOME/.swiftly/bin" >> $GITHUB_PATH

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Validate
        run: bash validate.sh
